# Render Blueprint for the FastAPI backend (in BE/).
# Create a Blueprint on Render pointing at this repo, or configure a Web Service
# manually with the same root dir + commands.
services:
  - type: web
    name: wordle-api
    runtime: python
    plan: free
    rootDir: BE
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Set to your Vercel URL once deployed, e.g.
      # https://your-wordle.vercel.app  (comma-separate multiple origins)
      - key: CLIENT_ORIGIN
        sync: false
